<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Splitwise — Share Expenses</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>💸 Splitwise</h1>
    <p class="tagline">Split bills, track balances, settle up.</p>
  </header>

  <main class="layout">
    <!-- Sidebar: people & groups -->
    <aside class="sidebar">
      <section class="card">
        <h2>People</h2>
        <form id="user-form" class="inline-form">
          <input id="user-name" type="text" placeholder="Name" required />
          <input id="user-email" type="email" placeholder="Email (optional)" />
          <button type="submit">Add</button>
        </form>
        <ul id="user-list" class="list"></ul>
      </section>

      <section class="card">
        <h2>Groups</h2>
        <form id="group-form" class="inline-form column">
          <input id="group-name" type="text" placeholder="Group name" required />
          <div id="group-members" class="checkbox-grid"></div>
          <button type="submit">Create group</button>
        </form>
        <ul id="group-list" class="list"></ul>
      </section>
    </aside>

    <!-- Main panel: selected group -->
    <section class="content">
      <div id="empty-state" class="empty">
        <p>Select or create a group to start tracking expenses.</p>
      </div>

      <div id="group-detail" class="hidden">
        <div class="group-header">
          <h2 id="group-title"></h2>
        </div>

        <div class="panels">
          <div class="card">
            <h3>Add an expense</h3>
            <form id="expense-form" class="column">
              <input id="exp-desc" type="text" placeholder="Description (e.g. Dinner)" required />
              <input id="exp-amount" type="number" step="0.01" min="0.01" placeholder="Amount" required />
              <label>Paid by
                <select id="exp-paidby"></select>
              </label>
              <label>Split
                <select id="exp-splittype">
                  <option value="equal">Equally</option>
                  <option value="exact">Exact amounts</option>
                  <option value="percent">Percentages</option>
                </select>
              </label>
              <div id="exp-participants" class="checkbox-grid"></div>
              <div id="exp-splitvalues" class="hidden"></div>
              <button type="submit">Add expense</button>
            </form>
          </div>

          <div class="card">
            <h3>Balances</h3>
            <ul id="balance-list" class="list"></ul>
            <h3>Settle up</h3>
            <ul id="settle-list" class="list"></ul>
            <form id="settle-form" class="inline-form">
              <select id="settle-from"></select>
              <span>pays</span>
              <select id="settle-to"></select>
              <input id="settle-amount" type="number" step="0.01" min="0.01" placeholder="Amount" required />
              <button type="submit">Record</button>
            </form>
          </div>
        </div>

        <div class="card">
          <h3>Expenses</h3>
          <ul id="expense-list" class="list"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
